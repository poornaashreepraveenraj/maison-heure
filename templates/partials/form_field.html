<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(optional)</span>{% endif %}</label>
    {% if field.field.widget.input_type == "password" %}
      <div class="password-wrap">
        {{ field }}
        <button class="toggle-password" type="button" data-toggle-password aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    {% else %}
      {{ field }}
    {% endif %}
  {% endif %}
  {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
