<div class="chat" data-chat data-endpoint="{% url 'support:api_chat' %}" data-feedback-endpoint="{% url 'support:api_feedback' %}">
  {% csrf_token %}
  <button class="chat-launcher" type="button" data-chat-open aria-controls="chat-panel" aria-expanded="false" aria-label="Open the Maison Heure Concierge chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 10h8M8 13h5"/></svg>
  </button>
  <section id="chat-panel" class="chat-panel" role="dialog" aria-labelledby="chat-title" aria-modal="false" inert data-chat-panel>
    <header class="chat-header">
      <div>
        <h2 id="chat-title">Maison Heure Concierge</h2>
        <p>Answers from our FAQ &amp; help desk</p>
      </div>
      <button class="icon-btn" type="button" data-chat-close aria-label="Close chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="chat-log" data-chat-log aria-live="polite">
      <div class="chat-msg bot">Hello — I'm the Maison Heure Concierge. Ask me about authenticity, delivery, returns, an order, or any error code you've seen.</div>
    </div>
    <div class="chat-chips">
      {% for reply in chat_quick_replies %}<button class="chip" type="button" data-chat-chip>{{ reply }}</button>{% endfor %}
    </div>
    <form class="chat-form" data-chat-form>
      <div class="chat-input-row">
        <label class="visually-hidden" for="chat-input">Your question</label>
        <input class="input" id="chat-input" name="message" type="text" maxlength="1000" placeholder="Ask a question…" autocomplete="off" required>
        <button class="btn btn-primary" type="submit">Send</button>
      </div>
      <div class="field chat-email">
        <label class="visually-hidden" for="chat-email">Email for a reply if we open a ticket (optional)</label>
        <input id="chat-email" name="email" type="email" placeholder="Email for ticket replies (optional)" autocomplete="email"{% if user.is_authenticated %} value="{{ user.email }}"{% endif %}>
      </div>
    </form>
  </section>
</div>
